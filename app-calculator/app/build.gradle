plugins {
    id 'com.android.application'
}



android {
    namespace 'com.lenovo.calculator2'
    compileSdk 35

    defaultConfig {
        // identity is fully overridable from CI:  -PcalcPkg=com.xxx.yyy -PcalcLabel=计算器
        applicationId project.findProperty('calcPkg') ?: 'com.lenovo.calculator2'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
        resValue "string", "calc_label", project.findProperty('calcLabel') ?: '计算器'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Dhizuku（设备所有者）API —— 用于对目标 App 执行“挂起/解挂”
    implementation 'io.github.iamr0s:Dhizuku-API:2.5.3'
}
